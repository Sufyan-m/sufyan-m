
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="300"
     viewBox="0 0 900 300">

  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#087f36"/>
      <stop offset="50%" stop-color="#39ff72"/>
      <stop offset="100%" stop-color="#a3ffbf"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="18" fill="#0d1117"/>

  <!-- Grid -->
  <g stroke="#1c3328" opacity=".5">
    <path d="M0 50H900 M0 100H900 M0 150H900 M0 200H900 M0 250H900"/>
    <path d="M50 0V300 M100 0V300 M150 0V300 M200 0V300
             M250 0V300 M300 0V300 M350 0V300 M400 0V300
             M450 0V300 M500 0V300 M550 0V300 M600 0V300
             M650 0V300 M700 0V300 M750 0V300 M800 0V300
             M850 0V300"/>
  </g>

  <!-- Heading -->
  <text x="35" y="55" fill="#ffffff"
        font-size="32" font-family="monospace"
        font-weight="bold">SUFYAN-M</text>

  <text x="37" y="82" fill="#39ff72"
        font-size="13" font-family="monospace">
    PYTHON DEVELOPER IN PROGRESS
  </text>

  <!-- Decorative commits -->
  <g fill="#39ff72">
    <rect x="120" y="120" width="13" height="13"/>
    <rect x="180" y="180" width="13" height="13"/>
    <rect x="270" y="110" width="13" height="13"/>
    <rect x="600" y="100" width="13" height="13"/>
    <rect x="710" y="190" width="13" height="13"/>
    <rect x="820" y="130" width="13" height="13"/>
  </g>

  <!-- Snake body -->
  <path d="M70 155
           C130 60 220 60 280 155
           S430 250 490 155
           S640 60 700 155
           S790 210 820 155"
        fill="none"
        stroke="#39ff72"
        stroke-width="17"
        stroke-linecap="round"
        stroke-dasharray="22 9"
        filter="url(#glow)">

    <animate attributeName="stroke-dashoffset"
             from="0" to="-62"
             dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Snake Head -->
  <circle cx="820" cy="155" r="23"
          fill="#39ff72" filter="url(#glow)"/>

  <circle cx="813" cy="148" r="4" fill="#0d1117"/>
  <circle cx="827" cy="148" r="4" fill="#0d1117"/>

  <!-- Tongue -->
  <path d="M840 155 L854 149 L859 143"
        stroke="#ff4757" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- Caption -->
  <text x="35" y="255"
        fill="#ffffff" font-size="17"
        font-family="monospace">
    EAT COMMITS. GROW YOUR STREAK.
  </text>

  <text x="865" y="278"
        fill="#39ff72" font-size="12"
        font-family="monospace" text-anchor="end">
    BUILT BY SUFYAN 🐍
  </text>

</svg>
