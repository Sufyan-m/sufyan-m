import urllib.request
import re
import os

USERNAME = "Sufyan-m"
OUTPUT_FILE = "snake.svg"

# 1. GitHub se aapke asli contribution boxes fetch karna (bina kisi library ke)
url = f"https://github.com{USERNAME}/contributions"
req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
html = urllib.request.urlopen(req).read().decode("utf-8")

# Dates aur contribution levels nikalna
cells = re.findall(r'data-date="([^"]+)"[^>]*data-level="(\d+)"', html)
cells.sort(key=lambda x: x[0])

# Grid setup (53 weeks x 7 days)
COLS = 53
ROWS = 7
SIZE = 12
GAP = 3
STEP = SIZE + GAP
WIDTH = COLS * STEP + 20
HEIGHT = ROWS * STEP + 20

COLORS = {
    "0": "#161b22",
    "1": "#0e4429",
    "2": "#006d32",
    "3": "#26a641",
    "4": "#39d353",
}

grid = [["0" for _ in range(ROWS)] for _ in range(COLS)]
for idx, (date, level) in enumerate(cells[: COLS * ROWS]):
    c = idx // ROWS
    r = idx % ROWS
    grid[c][r] = level

# 2. Snake ka rasta (Zig-Zag path jo saare green boxes khayega)
path_points = []
for c in range(COLS):
    rows_order = range(ROWS) if c % 2 == 0 else range(ROWS - 1, -1, -1)
    for r in rows_order:
        x = 10 + c * STEP + SIZE // 2
        y = 10 + r * STEP + SIZE // 2
        path_points.append((x, y, c, r))

path_d = "M " + " L ".join(f"{x},{y}" for x, y, _, _ in path_points)

# 3. SVG file generate karna (Dark Theme + Glowing Snake Animation)
svg_lines = [
    f'<svg xmlns="http://w3.org" width="{WIDTH}" height="{HEIGHT}" viewBox="0 0 {WIDTH} {HEIGHT}">',
    f'  <rect width="100%" height="100%" rx="8" fill="#0d1117" />',
]

# Contribution boxes draw karna
total_steps = len(path_points)
for step_idx, (x, y, c, r) in enumerate(path_points):
    lvl = grid[c][r]
    color = COLORS.get(lvl, "#161b22")
    rx = 10 + c * STEP
    ry = 10 + r * STEP
    eat_time = round((step_idx / total_steps) * 18, 2)
    svg_lines.append(
        f'  <rect x="{rx}" y="{ry}" width="{SIZE}" height="{SIZE}" rx="2" fill="{color}">'
        f'    <animate attributeName="fill" values="{color};#161b22;#161b22" dur="18s" begin="{eat_time}s" repeatCount="indefinite" />'
        f'  </rect>'
    )

# Snake ke 5 segments (Head + Tail) jo path par chalenge
snake_colors = ["#58a6ff", "#388bfd", "#1f6feb", "#1158c7", "#0d419d"]
for i, s_color in enumerate(snake_colors):
    delay = round(i * 0.12, 2)
    radius = 6 - (i * 0.6)
    svg_lines.append(
        f'  <circle r="{radius}" fill="{s_color}">'
        f'    <animateMotion dur="18s" begin="{delay}s" repeatCount="indefinite" path="{path_d}" />'
        f'  </circle>'
    )

svg_lines.append("</svg>")

with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
    f.write("\n".join(svg_lines))

print(f"Success! {OUTPUT_FILE} ban gaya hai! Total boxes: {len(path_points)}")
